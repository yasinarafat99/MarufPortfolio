<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <clipPath id="nbr-avatar-clip">
      <circle cx="416" cy="342" r="44" />
    </clipPath>
    <!-- Soft shadow for the avatar -->
    <filter id="avatar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean White Badge Background -->
  <rect width="800" height="800" fill="#ffffff" rx="140" />

  <!-- ================= Letter N ================= -->
  <path
    d="M 84 262 L 158 262 L 254 445 L 254 262 L 320 262 L 320 538 L 246 538 L 150 355 L 150 538 L 84 538 Z"
    fill="#1d1918"
  />

  <!-- ================= Letter B Components ================= -->
  <!-- Top counter circle: Person Avatar -->
  <circle cx="416" cy="342" r="44" fill="#202228" />
  <image
    href="/farabi-avatar.png"
    x="368"
    y="294"
    width="96"
    height="96"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#nbr-avatar-clip)"
    filter="url(#avatar-shadow)"
  />

  <!-- Bottom counter: Golden Block -->
  <path
    d="M 372 430 L 445 430 C 472 430 475 442 475 470 C 475 498 472 510 445 510 L 372 510 Z"
    fill="#e5a93c"
  />

  <!-- ================= Letter R (Black Outer Form) ================= -->
  <!-- Upper bowl of R & sweeping contour that envelopes B -->
  <path
    d="M 454 262 C 540 262 610 280 660 324 C 695 355 715 398 718 538 L 634 538 C 630 465 595 422 538 402 C 516 394 492 392 466 392 L 466 262 Z"
    fill="#1d1918"
  />

  <!-- Dynamic slanted leg of R -->
  <path
    d="M 534 394 L 632 394 L 718 538 L 634 538 L 570 444 L 526 444 Z"
    fill="#1d1918"
  />

  <!-- Middle and Top connections for B -->
  <path d="M 372 262 L 466 262 L 466 304 C 440 304 400 304 372 304 Z" fill="#1d1918" opacity="0.08" />
</svg>
